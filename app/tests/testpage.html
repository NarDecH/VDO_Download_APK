<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>VDO Grabber selftest page</title></head>
<body>
<h1>selftest page</h1>
<!-- DOM-scan target: a plain video element -->
<video id="v" width="320" height="180" controls
       src="http://127.0.0.1:__PORT__/dom-video.mp4"></video>
<!-- link target -->
<a href="http://127.0.0.1:__PORT__/linked.m3u8">linked playlist</a>

<!-- cross-origin iframe embed player (different port = different origin):
     JS cannot read inside it, so the iframe src itself must be reported
     as an embed candidate for yt-dlp -->
<iframe src="http://127.0.0.1:__PORT2__/embed.html" width="320" height="180"></iframe>

<!-- same-origin srcdoc iframe: the deep scan must reach inside and find
     the video element -->
<iframe srcdoc="<video controls width='280' src='http://127.0.0.1:__PORT__/iframe-video.mp4'></video>" width="320" height="180"></iframe>

<script>
  // network-hook target: a fetch() of an HLS manifest (no <video> tag involved)
  setTimeout(function () {
    fetch("http://127.0.0.1:__PORT__/hooked/master.m3u8").catch(function () {});
    var x = new XMLHttpRequest();
    x.open("GET", "http://127.0.0.1:__PORT__/hooked/manifest.mpd");
    try { x.send(); } catch (e) {}
  }, 300);
</script>
</body>
</html>
