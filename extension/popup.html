<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
:root{--line:#25335a;--dim:#93a4c3;--acc2:#ffc371;--grn:#16a34a}
*{box-sizing:border-box;margin:0;padding:0}
body{width:380px;background:#0b1020;color:#e8ecf4;font:13px/1.5 'Segoe UI',system-ui,sans-serif;padding:12px}
header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#ff5f6d,#ffc371);display:flex;align-items:center;justify-content:center;font-size:13px}
h1{font-size:14px}h1 small{color:var(--dim);font-weight:400;margin-left:4px}
button{all:unset;cursor:pointer;background:#1a2547;border-radius:8px;padding:6px 12px;font-size:12px;color:#cdd6e6}
button:hover{background:#243354}
button.grn{background:var(--grn);color:#fff;font-weight:700}
#list{max-height:280px;overflow:auto}
.item{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:7px;background:#131c33}
.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.item small{color:var(--dim);word-break:break-all;font-size:10.5px}
.row{display:flex;gap:6px;margin-top:5px}
.dl{background:var(--grn);color:#fff;font-weight:700;border-radius:7px;padding:4px 10px;cursor:pointer;border:0;font-size:11.5px}
.cp{background:#243354;color:#cdd6e6;border-radius:7px;padding:4px 9px;cursor:pointer;border:0;font-size:11px}
.empty{color:#5c6b8c;text-align:center;padding:18px 0}
details{margin-top:8px}
summary{cursor:pointer;color:var(--acc2);font-size:11.5px}
pre{background:#070b16;border:1px solid var(--line);border-radius:8px;padding:8px;font:10px Consolas,monospace;color:#b7c4de;
    max-height:120px;overflow:auto;white-space:pre-wrap;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="logo">▼</div>
  <h1>VDO Grabber <small id="tabHost"></small></h1>
  <span style="flex:1"></span>
  <button id="refresh">⟳</button>
</header>
<div id="list"><div class="empty">กำลังโหลด…</div></div>
<details>
  <summary>📜 Logs (ดีบัก)</summary>
  <pre id="logs">—</pre>
</details>
<script src="popup.js"></script>
</body>
</html>
