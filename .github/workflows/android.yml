name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM unit tests (MediaStore LRU)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK (debug-signed, installable)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          APK_NAME="VDOGrabber-${VERSION}-android.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          sha256sum "$APK_NAME" | tee "${APK_NAME}.sha256"

      - name: Upload artifact (every branch)
        uses: actions/upload-artifact@v7
        with:
          name: VDOGrabber-android-apk
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --draft=false --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$APK_NAME" "${APK_NAME}.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          # merge APK checksum into checksums.txt on the release
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "checksums.txt" --output checksums.txt 2>/dev/null || true
          grep -vF "$APK_NAME" checksums.txt 2>/dev/null | cat - "${APK_NAME}.sha256" > checksums.tmp || cat "${APK_NAME}.sha256" > checksums.tmp
          mv checksums.tmp checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
