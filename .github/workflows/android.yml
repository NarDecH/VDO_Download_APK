name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    # (actions/runner-images#14748) - keep a known-good image until tested
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run JVM unit tests (MediaStore LRU)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Generate HLS fixture with ffmpeg (E2E)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p android/app/src/androidTest/assets/hls
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc=duration=6:size=320x240:rate=15 \
            -f lavfi -i sine=frequency=440:duration=6 \
            -c:v libx264 -preset ultrafast -g 30 -sc_threshold 0 \
            -c:a aac -b:a 64k \
            -f hls -hls_time 3 -hls_list_size 0 \
            -hls_segment_filename "android/app/src/androidTest/assets/hls/seg%d.ts" \
            android/app/src/androidTest/assets/hls/index.m3u8
          ls -la android/app/src/androidTest/assets/hls

      - name: Build debug APK (debug-signed, installable)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      # The emulator sometimes boots into an unresponsive ADB shell on hosted
      # runners (software rendering / TCG) -> ShellCommandUnresponsiveException
      # and connectedDebugAndroidTest finds no device (seen on the v1.1.6 tag).
      # Run E2E twice with a FRESH emulator per attempt before giving up.
      - name: E2E on emulator (attempt 1)
        id: e2e1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: |
            chmod +x "$GITHUB_WORKSPACE/android/gradlew"
            # v1.1.9: full connectedDebugAndroidTest now also runs the
            # DownloadCleanerE2E delete tests (MediaStore / raw file /
            # real DownloadManager download -> delete -> assert gone)
            cd "$GITHUB_WORKSPACE/android" && ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: E2E on emulator (attempt 2 - fresh emulator after infra flake)
        id: e2e2
        if: steps.e2e1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: |
            chmod +x "$GITHUB_WORKSPACE/android/gradlew"
            cd "$GITHUB_WORKSPACE/android" && ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: E2E gate (both attempts failed)
        if: steps.e2e1.outcome == 'failure' && steps.e2e2.outcome != 'success'
        run: |
          echo "E2E failed on two fresh emulators - real failure"
          exit 1

      - name: Rename APKs (per-ABI + universal)
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          APK_NAME="VDOGrabber-${VERSION}-android-universal.apk"
          OUT=android/app/build/outputs/apk/debug
          cp "$OUT/app-arm64-v8a-debug.apk" "VDOGrabber-${VERSION}-android-arm64.apk"
          cp "$OUT/app-armeabi-v7a-debug.apk" "VDOGrabber-${VERSION}-android-armv7.apk"
          cp "$OUT/app-x86_64-debug.apk"    "VDOGrabber-${VERSION}-android-x86_64.apk"
          cp "$OUT/app-universal-debug.apk" "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "ABI_APKS=VDOGrabber-${VERSION}-android-arm64.apk VDOGrabber-${VERSION}-android-armv7.apk VDOGrabber-${VERSION}-android-x86_64.apk" >> "$GITHUB_ENV"
          sha256sum "$APK_NAME" VDOGrabber-"$VERSION"-android-*.apk | tee "${APK_NAME}.sha256"

      - name: Upload artifact (every branch)
        uses: actions/upload-artifact@v7
        with:
          name: VDOGrabber-android-apk
          path: |
            ${{ env.APK_NAME }}
            ${{ env.ABI_APKS }}
            ${{ env.APK_NAME }}.sha256

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --draft=false --generate-notes
          gh release upload "$GITHUB_REF_NAME" $ABI_APKS "$APK_NAME" "${APK_NAME}.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          # merge APK checksums into checksums.txt on the release
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "checksums.txt" --output checksums.txt 2>/dev/null || true
          grep -vE "VDOGrabber-.*-android" checksums.txt 2>/dev/null | cat - "${APK_NAME}.sha256" > checksums.tmp || cat "${APK_NAME}.sha256" > checksums.tmp
          mv checksums.tmp checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
          # guard: a re-created/moved tag would silently turn the release into a
          # draft (v1.1.7 incident) - force it published every time (v1.1.8)
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
