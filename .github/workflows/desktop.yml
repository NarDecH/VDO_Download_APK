name: Desktop selftest + exe

on:
  push:
    branches: [main]
    paths: ["app/**", "scripts/build_exe.py", "scripts/version_info.txt", "scripts/release.py", "requirements.txt", ".github/workflows/desktop.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["app/**", "scripts/build_exe.py", "scripts/version_info.txt", "scripts/release.py", "requirements.txt", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    # pinned: windows-latest tracks the newest image (2025 now) - keep a
    # known-good image until the next one is tested
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (stores / prune / pair-sync)
        run: python scripts/test_units.py

      # v1.5.0: smoke-test the release script itself - parses args, bumps 5
      # files in memory (dry-run never writes), checks the repo guards work.
      # A broken release.py now fails CI before it can break a real release.
      # Skipped on tag builds: the checkout is a detached HEAD there and
      # release.py requires a branch (this exact mismatch failed v1.5.0's
      # first tag build), while on main it needs a clean tree anyway.
      - name: Smoke test release script (dry-run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: python scripts/release.py 9.9.9 --dry-run --notes "ci smoke"

      - name: Prepare yt-dlp engine (bundled into exe)
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import build_exe; build_exe.ensure_ytdlp()"

      - name: Run selftest (engine + detection + real download)
        run: python app/main.py --selftest

      - name: Build exe
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/build_exe.py

      - name: Selftest the built exe (frozen mode)
        if: startsWith(github.ref, 'refs/tags/')
        run: ./dist/VDOGrabber.exe --selftest

      - name: Stage exe + checksum
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(grep -oP "APP_VERSION = \"\K[^\"]+" app/core/logger.py)
          EXE_NAME="VDOGrabber-${VERSION}-windows-x64.exe"
          mv dist/VDOGrabber.exe "$EXE_NAME"
          sha256sum "$EXE_NAME" | tee "$EXE_NAME.sha256"
          echo "EXE_NAME=$EXE_NAME" >> "$GITHUB_ENV"

      - name: Upload exe artifact (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: VDOGrabber-windows-exe
          path: |
            ${{ env.EXE_NAME }}
            ${{ env.EXE_NAME }}.sha256

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --draft=false --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$EXE_NAME" "$EXE_NAME.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          # merge exe checksum into checksums.txt on the release
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "checksums.txt" --output checksums.txt 2>/dev/null || true
          grep -vF "$EXE_NAME" checksums.txt 2>/dev/null | cat - "$EXE_NAME.sha256" > checksums.tmp || cat "$EXE_NAME.sha256" > checksums.tmp
          mv checksums.tmp checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
          # guard: a re-created/moved tag would silently turn the release into a
          # draft (v1.1.7 incident) - force it published every time (v1.1.8)
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
